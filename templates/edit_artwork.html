
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Artwork | Pixel Museum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body {
            background: #f7f3ff;
            font-family: Arial, sans-serif;
        }
        .edit-box {
            max-width: 520px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #e6def5;
        }
        h1 {
            color: #7251a6;
        }
        label {
            margin-top: 15px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="edit-box">
            <h1>Edit Artwork</h1>
            <p>Update your artwork details below.</p>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <label for="title" class="form-label">Artwork Title</label>
                <input class="form-control" type="text" id="title"
                       name="title" value="{{ artwork.title }}" required>

                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="Nature" {% if artwork.category == "Nature" %}selected{% endif %}>Nature</option>
                    <option value="Fantasy" {% if artwork.category == "Fantasy" %}selected{% endif %}>Fantasy</option>
                    <option value="Abstract" {% if artwork.category == "Abstract" %}selected{% endif %}>Abstract</option>
                </select>

                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description"
                          name="description" rows="4">{{ artwork.description }}</textarea>

                <button type="submit" class="btn btn-primary mt-4">
                    Save Changes
                </button>
                <a href="{% url 'my_artworks' %}" class="btn btn-secondary mt-4">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</body>
</html>
