
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pixel Museum</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0eaff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 320px;
            box-shadow: 0 5px 20px #d5c9ed;
        }

        h1 {
            text-align: center;
            color: #7251a6;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #805ad5;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
            text-align: center;
        }

        a {
            color: #7251a6;
        }

        p {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Pixel Museum</h1>
        <h3>Welcome Back!</h3>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?</p>
        <p><a href="{% url 'signup' %}">Create Account</a></p>
        <p><a href="{% url 'home' %}">Back to Home</a></p>
    </div>
</body>
</html>
