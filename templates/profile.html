
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Pixel Museum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f7f3ff;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            max-width: 500px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px #e6def5;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e9ddff;
            color: #7251a6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #7251a6;
        }

        .artwork-count {
            margin: 25px 0;
            padding: 20px;
            background: #f7f3ff;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="profile-card">

            <div class="profile-icon">👤</div>

            <h1>My Profile</h1>
            <p class="text-muted">Welcome to your Pixel Museum profile!</p>

            <hr>

            <h5>Username</h5>
            <p class="fs-5">{{ username }}</p>

            <div class="artwork-count">
                <h5>Total Artworks</h5>
                <h2>{{ total_artworks }}</h2>
            </div>

            <a href="{% url 'my_artworks' %}"
               class="btn btn-primary">
                My Artworks
            </a>

            <a href="{% url 'home' %}"
               class="btn btn-secondary">
                Home
            </a>

        </div>
    </div>
</body>
</html>
